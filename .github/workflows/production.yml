name: Verify production deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
concurrency:
  group: production-recovery
  cancel-in-progress: true
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Vercel deployment and retry failures
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_MAIN_DEPLOY_HOOK: ${{ secrets.VERCEL_MAIN_DEPLOY_HOOK }}
        run: python3 scripts/ensure-production.py
